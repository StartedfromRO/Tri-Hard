<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#05070F"/>
      <stop offset="100%" stop-color="#130924"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.25" cy="0.18" r="0.58">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.22" cy="0.82" r="0.58">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.85" cy="0.65" r="0.55">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="swimGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bikeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="runGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="45%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <path id="blade" d="M 256 92
           C 332 92, 396 142, 412 214
           C 382 164, 326 134, 264 138
           C 208 142, 164 180, 154 234
           C 138 162, 182 92, 256 92 Z"/>
  </defs>

  <!-- Full-Bleed Dark Obsidian Base -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowCyan)"/>
  <rect width="512" height="512" fill="url(#glowCoral)"/>
  <rect width="512" height="512" fill="url(#glowAmber)"/>

  <!-- Liquid Glass Outer Chrono Bezel -->
  <circle cx="256" cy="256" r="204" fill="url(#glassPlate)" stroke="url(#glassRim)" stroke-width="2.5"/>
  <ellipse cx="256" cy="144" rx="148" ry="74" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="3 15" stroke-linecap="round"/>

  <!-- 120-Degree Precision Tri-Vortex Blades (Swim, Bike, Run) -->
  <use href="#blade" fill="url(#swimGrad)"/>
  <use href="#blade" fill="url(#bikeGrad)" transform="rotate(120 256 256)"/>
  <use href="#blade" fill="url(#runGrad)" transform="rotate(240 256 256)"/>

  <!-- Central Liquid Glass Tri-Apex Core (Centered at 256, 256) -->
  <polygon points="256,192 311,288 201,288" fill="url(#glassPlate)" stroke="url(#glassRim)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="256,214 292,277 220,277" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
