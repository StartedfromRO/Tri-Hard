name: Sync Garmin

on:
  workflow_dispatch:           # runs when triggered: the app's Sync button, or manually from the Actions tab
  schedule:
    - cron: '30 23 * * *'      # 07:30 AM MYT (UTC+8) — morning sleep, HRV & readiness sync
    - cron: '30 12 * * *'      # 08:30 PM MYT (UTC+8) — evening workout & load sync

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore Garmin login
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          mkdir -p ~/.garminconnect
          printf '%s' "$GARMIN_TOKENS" > ~/.garminconnect/garmin_tokens.json
          chmod 600 ~/.garminconnect/garmin_tokens.json
      - name: Pull last 2 days
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python sync_garmin.py 2
