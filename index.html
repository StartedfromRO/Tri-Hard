<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tri-hard-thlete</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg:#F2F2F7; --card:#FFFFFF; --txt:#1C1C1E; --mut:#8E8E93; --sep:rgba(60,60,67,.12);
    --grid:rgba(60,60,67,.10); --fill:rgba(118,118,128,.12); --accent:#007AFF; --glass:rgba(242,242,247,.72);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --swim:#32ADE6; --bike:#FF9500; --run:#FF2D55; --other:#AF52DE; --green:#34C759; --indigo:#5856D6;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#000000; --card:#1C1C1E; --txt:#F5F5F7; --mut:#98989F; --sep:rgba(84,84,88,.45);
    --grid:rgba(84,84,88,.30); --fill:rgba(118,118,128,.24); --accent:#0A84FF; --glass:rgba(0,0,0,.65);
    --shadow:none;
    --swim:#64D2FF; --bike:#FF9F0A; --run:#FF375F; --other:#BF5AF2; --green:#30D158; --indigo:#7D7AFF;
  } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body { margin:0; font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
         background:var(--bg); color:var(--txt); padding-bottom:calc(24px + env(safe-area-inset-bottom));
         -webkit-font-smoothing:antialiased }
  header { max-width:900px; margin:auto; padding:calc(20px + env(safe-area-inset-top)) 20px 8px;
           display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap }
  h1 { margin:0; font-size:32px; line-height:1.1; font-weight:700; letter-spacing:-.03em }
  #status { font-size:13px; color:var(--mut); margin-top:4px }
  .ctl { display:flex; gap:8px; align-items:center }
  button,select { font:inherit; font-size:14px; font-weight:500; color:var(--accent); background:var(--fill); border:0;
                  border-radius:999px; padding:8px 14px; cursor:pointer; transition:opacity .15s, transform .15s }
  button:active { opacity:.6; transform:scale(.97) }
  select { appearance:none; -webkit-appearance:none; padding-right:14px; color:var(--txt) }
  #sync { background:var(--accent); color:#fff }
  #signout { background:none; color:var(--mut); padding:8px 6px }
  nav { position:sticky; top:0; z-index:5; padding:8px 20px 12px; max-width:900px; margin:auto }
  nav .seg { display:flex; gap:2px; padding:3px; border-radius:12px; background:var(--fill) }
  nav::before { content:""; position:absolute; inset:0 0 0 0; z-index:-1; background:var(--glass);
                -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px) }
  nav button { flex:1; background:none; color:var(--txt); border-radius:9px; padding:7px 4px; font-size:13px; font-weight:500 }
  nav button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.18); font-weight:600 }
  main { padding:4px 20px 0; max-width:900px; margin:auto }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px }
  .grid .card { margin:0 }
  .card { background:var(--card); border-radius:20px; padding:18px; margin-bottom:12px; box-shadow:var(--shadow) }
  .card > b { display:block; font-size:13px; font-weight:600; color:var(--mut); margin-bottom:12px; letter-spacing:.01em }
  .big { font-size:30px; line-height:1.15; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums }
  .mut { color:var(--mut); font-size:13px }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px }
  table { width:100%; border-collapse:collapse }
  th { color:var(--mut); font-weight:500; font-size:12px }
  td,th { padding:11px 4px; text-align:left; border-bottom:1px solid var(--sep); font-size:14px; font-variant-numeric:tabular-nums }
  tr:last-child td { border-bottom:0 }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:12px }
  .tiles .tile:last-child:nth-child(odd) { grid-column:1 / -1 }
  @media (min-width:700px) { .tiles { grid-template-columns:repeat(5,1fr) } .tiles .tile:last-child:nth-child(odd) { grid-column:auto } }
  .tile { background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; min-height:112px }
  .tl { font-size:12px; font-weight:600; color:var(--mut); letter-spacing:.02em; text-transform:uppercase }
  .tv { font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; white-space:nowrap }
  .tv small { font-size:13px; font-weight:500; color:var(--mut); margin-left:4px; letter-spacing:0 }
  .td { font-size:12px; font-weight:500; color:var(--mut); margin-top:auto }
  .td.good { color:var(--green) } .td.bad { color:var(--run) }
  .bar { height:6px; border-radius:99px; background:var(--fill); overflow:hidden; margin-top:2px }
  .bar.lg { height:10px; margin-top:14px }
  .bar i { display:block; height:100%; width:0; border-radius:99px; transition:width .6s cubic-bezier(.2,.8,.2,1) }
  #readyBar { background:var(--green) }
  .tab { display:none } .tab.on { display:block; animation:fade .25s ease }
  @keyframes fade { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  #login { display:none; position:fixed; inset:0; background:var(--bg); z-index:9; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:24px }
  #login input { width:100%; max-width:320px; padding:14px 16px; font:inherit; color:var(--txt); background:var(--card);
                 border:1px solid var(--sep); border-radius:14px; outline:none }
  #login input:focus { border-color:var(--accent) }
  #login button { width:100%; max-width:320px; padding:14px; border-radius:14px; background:var(--accent); color:#fff; font-weight:600; font-size:16px }
</style>
</head>
<body>
<header>
  <div><h1>Tri-hard-thlete</h1><div id="status"></div></div>
  <div class="ctl"><select id="range"><option value="7">7 days</option><option value="28" selected>4 weeks</option><option value="90">12 weeks</option><option value="365">1 year</option></select>
  <button id="sync">Sync</button><button id="signout">Sign out</button></div>
</header>
<div id="login">
  <h1 style="margin-bottom:12px">Tri-hard-thlete</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signin">Sign in</button><div id="loginErr" class="mut"></div>
</div>
<nav><div class="seg">
  <button data-t="dash" class="on">Dashboard</button>
  <button data-t="perf">Performance</button>
  <button data-t="rec">Recovery</button>
  <button data-t="log">Log</button>
</div></nav>
<main>
  <section id="t-dash" class="tab on">
    <div class="grid" id="totals"></div>
    <div class="card"><b>Weekly volume (hours)</b><canvas id="volChart" height="150"></canvas></div>
    <div class="card"><b>Training load (7d vs 28d avg, hrs/week)</b><div id="load" class="big"></div><div class="mut" id="loadHint"></div></div>
  </section>
  <section id="t-perf" class="tab">
    <div class="card"><b>Run pace (min/km)</b><canvas id="runChart" height="150"></canvas></div>
    <div class="card"><b>Bike avg speed (km/h)</b><canvas id="bikeChart" height="150"></canvas></div>
    <div class="card"><b>Swim pace (min/100m)</b><canvas id="swimChart" height="150"></canvas></div>
  </section>
  <section id="t-rec" class="tab">
    <div class="card"><div class="mut">READINESS</div><div class="big" id="ready">–</div><div class="bar lg"><i id="readyBar"></i></div><div class="mut" id="readyHint" style="margin-top:10px"></div></div>
    <div class="tiles" id="recTiles"></div>
    <div class="card"><b>HRV (overnight avg, ms) vs 7-day baseline</b><canvas id="hrvChart" height="150"></canvas></div>
    <div class="card"><b>Resting HR (bpm)</b><canvas id="rhrChart" height="120"></canvas></div>
    <div class="card"><b>Sleep (hours) &amp; score</b><canvas id="sleepChart" height="150"></canvas></div>
    <div class="card"><b>Body Battery (high / low)</b><canvas id="bbChart" height="120"></canvas></div>
  </section>
  <section id="t-log" class="tab">
    <div class="card"><table><thead><tr><th>Date</th><th>Sport</th><th>Dist</th><th>Time</th><th>HR</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>


<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SUPABASE_URL = "https://euwbsqptvfxbpebgnmak.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1GZreKWeSL7MHLooyDMXpA_Ism2J3Mz"; // publishable key (read-only via RLS)
// ================================================================

const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS = {swim:C('--swim'), bike:C('--bike'), run:C('--run'), other:C('--other')};
Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif';
Chart.defaults.elements.bar.borderRadius = 6;
Chart.defaults.elements.line.borderWidth = 2.5;
Chart.defaults.color = C('--mut');
const $ = s => document.querySelector(s);
let acts = [], health = [], charts = {};

function demoHealth() {
  const out = [];
  for (let d = 120; d >= 0; d--) {
    const dt = new Date(Date.now() - d*864e5).toISOString().slice(0,10);
    out.push({calendar_date:dt, hrv_night_avg:62+Math.sin(d/5)*8+Math.random()*6|0, resting_hr:48+Math.random()*5|0,
      sleep_s:(6.5+Math.random()*2)*3600, sleep_score:65+Math.random()*30|0,
      body_battery_high:70+Math.random()*28|0, body_battery_low:10+Math.random()*25|0});
  }
  return out;
}

function demoData() {
  const out = [], now = Date.now();
  for (let d = 120; d >= 0; d--) {
    const t = new Date(now - d*864e5); const k = d % 7;
    const mk = (sport, dist, spd) => out.push({summary_id:'d'+d+sport, sport, start_time:t.toISOString(),
      distance_m:dist, duration_s:dist/spd, avg_hr:130+Math.random()*25|0, avg_speed_mps:spd});
    if (k===0) mk('swim', 1800+Math.random()*800, 0.95+Math.random()*0.1 + (120-d)*0.0005);
    if (k===2) mk('run', 8000+Math.random()*4000, 3.0+Math.random()*0.3 + (120-d)*0.002);
    if (k===4) mk('bike', 40000+Math.random()*30000, 7.5+Math.random()*1 + (120-d)*0.005);
    if (k===5) mk('run', 12000+Math.random()*6000, 3.0+Math.random()*0.3 + (120-d)*0.002);
  }
  return out;
}

const sb = SUPABASE_URL ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#pw').value });
  if (error) { $('#loginErr').textContent = error.message; return; }
  load();
}
async function signOut() { await sb.auth.signOut(); localStorage.removeItem('tri-cache'); location.reload(); }

async function load() {
  if (!sb) { acts = demoData(); health = demoHealth(); $('#status').textContent = 'Demo data — set SUPABASE_URL / KEY in index.html'; return render(); }
  const { data: { session } } = await sb.auth.getSession();
  $('#login').style.display = session ? 'none' : 'flex';
  if (!session) return;
  $('#status').textContent = 'Syncing…';
  const since = new Date(Date.now() - 400*864e5).toISOString();
  const { data, error } = await sb.from('activities').select('*').gte('start_time', since).order('start_time');
  if (error) { $('#status').textContent = 'Error: ' + error.message; return; }
  acts = data; localStorage.setItem('tri-cache', JSON.stringify(data));
  const h = await sb.from('daily_health').select('*').gte('calendar_date', since.slice(0,10)).order('calendar_date');
  health = h.data || [];
  $('#status').textContent = 'Last sync ' + new Date().toLocaleTimeString() + ' · ' + data.length + ' activities';
  render();
}

const hms = s => { s = Math.round(s||0); const h=s/3600|0, m=(s%3600)/60|0; return h ? `${h}h${String(m).padStart(2,'0')}` : `${m}m`; };
const km = m => (m/1000).toFixed(1);
function mondayOf(d) { d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function mkChart(id, cfg) { charts[id]?.destroy(); charts[id] = new Chart($('#'+id), cfg); }
const axis = {ticks:{color:C('--mut')}, grid:{color:C('--grid')}, border:{display:false}};

function render() {
  const days = +$('#range').value, cutoff = Date.now() - days*864e5;
  const inR = acts.filter(a => new Date(a.start_time) >= cutoff);

  // totals
  const sum = sp => inR.filter(a => a.sport===sp);
  const tot = (list,f) => list.reduce((s,a)=>s+(a[f]||0),0);
  $('#totals').innerHTML = ['swim','bike','run'].map(sp => {
    const l = sum(sp);
    return `<div class="card"><div class="mut"><span class="dot" style="background:${COLORS[sp]}"></span>${sp.toUpperCase()}</div>
      <div class="big">${km(tot(l,'distance_m'))} km</div><div class="mut">${hms(tot(l,'duration_s'))} · ${l.length} sessions</div></div>`;
  }).join('') + `<div class="card"><div class="mut">TOTAL TIME</div><div class="big">${hms(tot(inR,'duration_s'))}</div><div class="mut">${inR.length} sessions</div></div>`;

  // weekly volume stacked
  const weeks = {};
  acts.forEach(a => { const k = mondayOf(a.start_time).toISOString().slice(0,10);
    (weeks[k] ??= {swim:0,bike:0,run:0,other:0})[a.sport] += (a.duration_s||0)/3600; });
  const wk = Object.keys(weeks).sort().slice(-Math.max(4, Math.ceil(days/7)));
  mkChart('volChart', {type:'bar', data:{labels:wk.map(w=>w.slice(5)),
    datasets:['swim','bike','run'].map(sp=>({label:sp, backgroundColor:COLORS[sp], data:wk.map(w=>+weeks[w][sp].toFixed(2))}))},
    options:{scales:{x:{...axis,stacked:true},y:{...axis,stacked:true}},plugins:{legend:{labels:{color:C('--txt')}}}}});

  // load ratio
  const hrs = d => acts.filter(a => new Date(a.start_time) >= Date.now()-d*864e5).reduce((s,a)=>s+(a.duration_s||0)/3600,0);
  const acute = hrs(7), chronic = hrs(28)/4, r = chronic ? acute/chronic : 0;
  $('#load').textContent = `${acute.toFixed(1)} / ${chronic.toFixed(1)} h  (ratio ${r.toFixed(2)})`;
  $('#loadHint').textContent = r>1.5 ? 'Load spike — injury risk' : r>1.1 ? 'Building' : r>0.8 ? 'Maintaining' : 'Detraining / taper';

  // performance trends
  const trend = (id, sp, fn, label, color) => {
    const l = acts.filter(a => a.sport===sp && a.distance_m>500 && a.duration_s);
    mkChart(id, {type:'line', data:{labels:l.map(a=>a.start_time.slice(5,10)),
      datasets:[{label, data:l.map(fn), borderColor:color, tension:.3, pointRadius:2}]},
      options:{scales:{x:axis,y:axis},plugins:{legend:{display:false}}}});
  };
  trend('runChart','run',a=>+(a.duration_s/60/(a.distance_m/1000)).toFixed(2),'min/km',COLORS.run);
  trend('bikeChart','bike',a=>+(a.distance_m/a.duration_s*3.6).toFixed(1),'km/h',COLORS.bike);
  trend('swimChart','swim',a=>+(a.duration_s/60/(a.distance_m/100)).toFixed(2),'min/100m',COLORS.swim);

  renderRecovery(days);

  // log
  $('#rows').innerHTML = [...inR].reverse().map(a => `<tr><td>${a.start_time.slice(5,10)}</td>
    <td><span class="dot" style="background:${COLORS[a.sport]}"></span>${a.sport}</td>
    <td>${km(a.distance_m||0)} km</td><td>${hms(a.duration_s)}</td><td>${a.avg_hr??'–'}</td></tr>`).join('');
}

function renderRecovery(days) {
  const cutoff = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const all = health, hs = all.filter(h => h.calendar_date >= cutoff);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const vals = (arr,k) => arr.map(h=>h[k]).filter(v=>v!=null);
  // 7-day rolling baseline for HRV
  const base = all.map((h,i) => avg(vals(all.slice(Math.max(0,i-6),i+1),'hrv_night_avg')));
  const idx = new Map(all.map((h,i)=>[h.calendar_date,i]));
  const labels = hs.map(h=>h.calendar_date.slice(5));

  // readiness: last HRV vs 28d baseline, resting HR vs baseline, sleep score, body battery
  const last = all[all.length-1];
  if (last) {
    const b28 = avg(vals(all.slice(-29,-1),'hrv_night_avg')), r28 = avg(vals(all.slice(-29,-1),'resting_hr'));
    let score = 50, n = 0;
    if (last.hrv_night_avg && b28) { score += Math.max(-25, Math.min(25, (last.hrv_night_avg/b28-1)*100)); n++; }
    if (last.resting_hr && r28) { score += Math.max(-15, Math.min(15, (r28-last.resting_hr)*3)); n++; }
    if (last.sleep_score) { score += (last.sleep_score-70)/3; n++; }
    if (last.body_battery_high) { score += (last.body_battery_high-70)/4; n++; }
    score = Math.round(Math.max(0, Math.min(100, score)));
    $('#ready').textContent = n ? score + ' / 100' : '–';
    $('#readyHint').textContent = !n ? 'No health data yet' : score>=75 ? 'Good to go — hard session OK' : score>=50 ? 'Moderate — keep intensity controlled' : 'Low — easy day or rest';
    $('#readyBar').style.width = (n ? score : 0) + '%';
    $('#readyBar').style.background = score >= 75 ? C('--green') : score >= 50 ? C('--bike') : C('--run');
    const prev = k => avg(vals(all.slice(-29, -1), k));
    // dir: 1 = higher is better, -1 = lower is better, 0 = neutral
    const tile = (label, v, unit, k, dir, pct, color) => {
      const has = v != null && v !== '';
      let delta = '', cls = '';
      const b = k ? prev(k) : null;
      if (has && b != null && typeof v === 'number') {
        const d = v - b;
        const good = dir === 0 ? '' : (d * dir > 0 ? 'good' : d * dir < 0 ? 'bad' : '');
        cls = good; delta = (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(Math.abs(d) < 10 ? 1 : 0) + ' vs 28d avg';
      } else if (!has) delta = 'No data';
      const bar = has && pct != null ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%;background:${color}"></i></div>` : '';
      return `<div class="tile"><div class="tl">${label}</div><div class="tv">${has ? v : '–'}${has && unit ? `<small>${unit}</small>` : ''}</div>${bar}<div class="td ${cls}">${delta}</div></div>`;
    };
    $('#recTiles').innerHTML =
        tile('HRV', last.hrv_night_avg ? Math.round(last.hrv_night_avg) : null, 'ms', 'hrv_night_avg', 1)
      + tile('Resting HR', last.resting_hr || null, 'bpm', 'resting_hr', -1)
      + tile('Sleep', last.sleep_s ? hms(last.sleep_s) : null, '', null, 0)
      + tile('Sleep score', last.sleep_score ?? null, '/100', 'sleep_score', 1, last.sleep_score, C('--indigo'))
      + tile('Body Battery', last.body_battery_high ?? null, '/100', 'body_battery_high', 1, last.body_battery_high, C('--swim'));
  }

  mkChart('hrvChart', {type:'line', data:{labels, datasets:[
    {label:'HRV', data:hs.map(h=>h.hrv_night_avg), borderColor:C('--green'), tension:.3, pointRadius:2},
    {label:'7d baseline', data:hs.map(h=>{const v=base[idx.get(h.calendar_date)]; return v&&+v.toFixed(1)}), borderColor:C('--mut'), borderDash:[5,5], pointRadius:0}]},
    options:{scales:{x:axis,y:axis},plugins:{legend:{labels:{color:C('--txt')}}}}});
  mkChart('rhrChart', {type:'line', data:{labels, datasets:[{data:hs.map(h=>h.resting_hr), borderColor:COLORS.run, tension:.3, pointRadius:2}]},
    options:{scales:{x:axis,y:axis},plugins:{legend:{display:false}}}});
  mkChart('sleepChart', {data:{labels, datasets:[
    {type:'bar', label:'hours', data:hs.map(h=>h.sleep_s&&+(h.sleep_s/3600).toFixed(1)), backgroundColor:C('--indigo'), yAxisID:'y'},
    {type:'line', label:'score', data:hs.map(h=>h.sleep_score), borderColor:COLORS.bike, pointRadius:2, yAxisID:'y2'}]},
    options:{scales:{x:axis,y:axis,y2:{...axis,position:'right',grid:{display:false}}},plugins:{legend:{labels:{color:C('--txt')}}}}});
  mkChart('bbChart', {type:'line', data:{labels, datasets:[
    {label:'high', data:hs.map(h=>h.body_battery_high), borderColor:COLORS.swim, pointRadius:1},
    {label:'low', data:hs.map(h=>h.body_battery_low), borderColor:COLORS.other, pointRadius:1}]},
    options:{scales:{x:axis,y:axis},plugins:{legend:{labels:{color:C('--txt')}}}}});
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button,.tab').forEach(e => e.classList.remove('on'));
  b.classList.add('on'); $('#t-'+b.dataset.t).classList.add('on');
});
// Sync = ask the cloud to pull fresh data from Garmin, wait for it to finish, then reload.
let syncing = false;
async function syncNow() {
  if (syncing || !sb) return load();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return load();
  let note = ''; syncing = true; $('#sync').disabled = true;
  const call = (method) => fetch('/.netlify/functions/sync', { method, headers: { authorization: 'Bearer ' + session.access_token } });
  try {
    const r = await call('POST');
    if (!r.ok) throw new Error('trigger failed (' + r.status + ')');
    const { startedAt } = await r.json();
    $('#status').textContent = 'Pulling from Garmin…';
    const t0 = Date.now();
    while (Date.now() - t0 < 150000) {
      await new Promise(res => setTimeout(res, 5000));
      const s = await (await call('GET')).json();
      if (s.createdAt >= startedAt - 15000 && s.status === 'completed') {
        if (s.conclusion !== 'success') note = 'Garmin pull failed — showing saved data';
        break;
      }
    }
  } catch (e) {
    note = 'Could not start Garmin pull (' + e.message + ') — showing saved data';
  }
  syncing = false; $('#sync').disabled = false;
  await load();
  if (note) $('#status').textContent = note;
}

$('#range').onchange = render; $('#sync').onclick = syncNow; $('#signin').onclick = signIn; $('#signout').onclick = signOut;
load();
</script>
</body>
